<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6feb">
<title>26机智11班 · 班级小站</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="班级小站">
<style>
  html,body{margin:0;padding:0;height:100%;background:#eef2f9;overflow:hidden;
    -webkit-tap-highlight-color:transparent;}
  .frame{position:fixed;inset:0;}
  .frame iframe{display:block;width:100%;height:100%;border:0;background:#eef2f9;}
  /* 加载时先给个简单的等待提示，iframe 起来后被盖住 */
  .boot{position:fixed;inset:0;display:grid;place-items:center;gap:10px;
    background:#eef2f9;color:#5b6675;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    z-index:-1;}
  noscript{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;
    font:14px/1.8 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#5b6675;}

  /* iOS「添加到主屏幕」引导条 */
  .install-tip{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:9;display:flex;align-items:center;gap:10px;
    background:#1f2430;color:#fff;border-radius:14px;padding:11px 12px;
    font:13px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    box-shadow:0 8px 24px rgba(10,16,32,.35);}
  .install-tip .ic{font-size:20px;flex:0 0 auto;}
  .install-tip p{margin:0;flex:1;}
  .install-tip b{color:#ffd76e;}
  .install-tip button{flex:0 0 auto;border:0;background:rgba(255,255,255,.16);color:#fff;
    border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer;}
  .install-tip[hidden]{display:none;}
</style>
</head>
<body>
<div class="frame">
  <iframe
    id="appFrame"
    src="https://class-hub-24937.app.workbuddy.host/?sharecode=UTWN77ARPB"
    title="26机智11班 班级小站"
    allow="clipboard-write; fullscreen; camera; microphone"
    referrerpolicy="no-referrer-when-downgrade"
    loading="eager"></iframe>
</div>
<noscript>这个页面需要开启 JavaScript 才能显示班级小站。</noscript>

<div class="install-tip" id="installTip" hidden>
  <span class="ic">📲</span>
  <p>想像 App 一样用？点 Safari 底部的<b>分享</b>按钮，选<b>添加到主屏幕</b>，桌面就有图标啦。</p>
  <button type="button" id="installClose">知道了</button>
</div>

<script>
(function () {
  'use strict';

  var APP_ORIGIN = 'https://class-hub-24937.app.workbuddy.host';
  var BASE_TITLE = document.title;
  var lastN = -1;

  /* ---- 防缓存：给 iframe 的地址加一个每小时变一次的参数，
     避免手机浏览器拿旧缓存里的班级小站页面（线上响应头没有 Cache-Control） ---- */
  try {
    var f = document.getElementById('appFrame');
    if (f) {
      var u = new URL(f.getAttribute('src'));
      u.searchParams.set('v', String(Math.floor(Date.now() / 3600000)));
      f.src = u.toString();
    }
  } catch (err) { /* 改不了就用原地址 */ }

  /* ---- 图标红点：桌面图标角标 + 标签页标题 + 标签页图标，三个一起上 ----
     光靠 setAppBadge 在电脑浏览器里是不生效的（它只对"装到桌面"的 PWA 有用），
     所以标题前面挂数字、图标上画红点，两者在任何浏览器都看得见。 */
  var ICON = new Image();
  var iconReady = false;
  ICON.onload = function () { iconReady = true; if (lastN >= 0) paintFav(lastN); };
  ICON.src = 'icon-192.png';

  function rrect(x, X, Y, W, H, R) {
    if (x.roundRect) { x.beginPath(); x.roundRect(X, Y, W, H, R); return; }
    x.beginPath();
    x.moveTo(X + R, Y);
    x.lineTo(X + W - R, Y); x.quadraticCurveTo(X + W, Y, X + W, Y + R);
    x.lineTo(X + W, Y + H - R); x.quadraticCurveTo(X + W, Y + H, X + W - R, Y + H);
    x.lineTo(X + R, Y + H); x.quadraticCurveTo(X, Y + H, X, Y + H - R);
    x.lineTo(X, Y + R); x.quadraticCurveTo(X, Y, X + R, Y);
    x.closePath();
  }

  function paintFav(n) {
    try {
      var c = document.createElement('canvas');
      c.width = c.height = 64;
      var x = c.getContext('2d');
      if (!x) return;
      if (iconReady) x.drawImage(ICON, 0, 0, 64, 64);
      else { x.fillStyle = '#2f6feb'; x.fillRect(0, 0, 64, 64); }
      if (n) {
        var t = n > 99 ? '99+' : String(n);
        var w = t.length > 2 ? 34 : t.length > 1 ? 30 : 24;
        x.fillStyle = '#e8503f';
        rrect(x, 62 - w, 38, w, 24, 12);
        x.fill();
        x.strokeStyle = '#fff'; x.lineWidth = 3; x.stroke();
        x.fillStyle = '#fff';
        x.font = 'bold ' + (t.length > 2 ? 17 : 19) + 'px -apple-system,Arial,sans-serif';
        x.textAlign = 'center'; x.textBaseline = 'middle';
        x.fillText(t, 62 - w / 2, 51);
      }
      var l = document.querySelector('link[rel~="icon"]');
      if (!l) { l = document.createElement('link'); l.rel = 'icon'; document.head.appendChild(l); }
      l.href = c.toDataURL('image/png');
    } catch (err) { /* 画不出来不影响别的 */ }
  }

  function applyBadge(n) {
    n = Math.max(0, Number(n) || 0);
    if (n === lastN) return;
    lastN = n;
    document.title = n ? '(' + (n > 99 ? '99+' : n) + ') ' + BASE_TITLE : BASE_TITLE;
    paintFav(n);
    try {
      if (navigator.setAppBadge) {
        if (n > 0) { var p = navigator.setAppBadge(n); if (p && p.catch) p.catch(function () {}); }
        else if (navigator.clearAppBadge) { var q = navigator.clearAppBadge(); if (q && q.catch) q.catch(function () {}); }
      }
    } catch (err) { /* 浏览器不支持就算了 */ }
  }

  /* ---- 桌面图标角标：小站把未读总数 postMessage 过来，这里负责设/清 ---- */
  window.addEventListener('message', function (e) {
    if (e.origin !== APP_ORIGIN) return;
    var d = e.data || {};
    if (d.type !== 'class-hub:badge') return;
    applyBadge(d.count);
  });

  /* ---- Service Worker：让「添加到主屏幕」变成可安装的 PWA ---- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }

  /* ---- iOS 添加到主屏幕引导：只对没装过的 Safari 用户提示一次 ---- */
  var tip = document.getElementById('installTip');
  if (tip) {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;
    var dismissed = false;
    try { dismissed = localStorage.getItem('class-hub-install-tip') === 'off'; } catch (e) {}
    if (isIOS && !standalone && !dismissed) tip.hidden = false;
    document.getElementById('installClose').addEventListener('click', function () {
      tip.hidden = true;
      try { localStorage.setItem('class-hub-install-tip', 'off'); } catch (e) {}
    });
  }
})();
</script>
</body>
</html>
